name: Bilevel V7 tensor tests

on:
  push:
    branches: ["codex/task-feedback-bilevel-v7"]
  pull_request:

jobs:
  tensor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU PyTorch
        run: pip install torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile
        run: python -m compileall -q deit
      - name: Test bilevel invariants
        run: PYTHONPATH=deit python -m unittest -v deit/test_semantic_bilevel.py
